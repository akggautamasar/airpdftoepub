[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "free-pdfepub"
version = "0.1.0"
description = "Reflowable PDF to EPUB3 conversion engine"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pdfplumber>=0.11,<1", "pypdfium2>=4.30,<6", "Pillow>=11,<13",
  "pypdf>=5,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "httpx>=0.27,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "reportlab>=4,<5"]
[project.scripts]
pdfepub = "pdfepub.cli:main"
[tool.setuptools.packages.find]
where = ["."]
